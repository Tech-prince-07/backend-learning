<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Portal</title>

    <link rel="stylesheet" href="/register-portal.css">
</head>

<body>

    <header>
        <div class="logo">🌐 First Project</div>

        <nav>
            <a href="/">Home</a>
            <a href="/login">login</a>
            <a href="/problem-submit">Contact</a>
        </nav>
    </header>

    <main>

        <div class="register-container">

            <h1>Create Your Account</h1>
            <p>Fill in the details below to register.</p>

            <form action="/submit-details" method="post">

                <div class="input-box">
                    <label for="username">Full Name</label>
                    <input type="text" id="username" name="name" placeholder="Enter your full name" required>
                </div>

                <div class="input-box">
                    <label for="useremail">Email Address</label>
                    <input type="email" id="useremail" name="email" placeholder="Enter your email" required>
                </div>

                <div class="input-box">
                    <label for="password">Password</label>
                    <input type="text" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <div class="input-box">
                    <label>Gender</label>

                    <div class="gender">

                        <label>
                            <input type="radio" name="gender" value="Male" required>
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Female">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Other">
                            Other
                        </label>

                    </div>
                </div>

                <div class="input-box">
                    <label for="address">Address</label>

                    <textarea id="address" name="address" rows="4" placeholder="Enter your address" required></textarea>
                </div>

                <input type="submit" value="Create Account" class="submit-btn">

            </form>

        </div>

    </main>

    <footer>

        <h3>Terms & Conditions</h3>

        <p>
            By registering, you agree to our policies and guidelines.
        </p>

        <p>
            Need help?
            <a href="/problem-submit">Contact Us</a>
        </p>

    </footer>

</body>

</html>
